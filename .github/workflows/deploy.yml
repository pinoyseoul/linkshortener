name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          CI: true
          NUXT_SITE_TOKEN: ${{ secrets.NUXT_SITE_TOKEN }}

      - name: Deploy to Cloudflare via API
        run: |
          ACCOUNT_ID="${{ secrets.NUXT_CF_ACCOUNT_ID }}"
          API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          SCRIPT_NAME="linkshortener"

          METADATA='{
            "main_module": "index.mjs",
            "bindings": [
              {"name": "KV", "type": "kv_namespace", "namespace_id": "01538a329f5b43ea912dddd83fbeee82"},
              {"name": "R2", "type": "r2_bucket", "bucket_name": "pinoyseoul"},
              {"name": "ANALYTICS", "type": "analytics_engine", "dataset": "pinoyseoul"},
              {"name": "AI", "type": "ai"},
              {"name": "ASSETS", "type": "assets"}
            ],
            "compatibility_date": "2026-04-04",
            "compatibility_flags": ["nodejs_compat"],
            "keep_vars": true,
            "triggers": {"crons": ["0 0 * * *"]}
          }'

          BOUNDARY="----DeployBoundary$$"

          {
            printf -- "--%s\r\n" "$BOUNDARY"
            printf "Content-Disposition: form-data; name=\"metadata\"\r\n"
            printf "Content-Type: application/json\r\n\r\n"
            printf "%s\r\n" "$METADATA"
            printf -- "--%s\r\n" "$BOUNDARY"
            printf "Content-Disposition: form-data; name=\"index.mjs\"; filename=\"index.mjs\"\r\n"
            printf "Content-Type: application/javascript\r\n\r\n"
            cat .output/server/index.mjs
            printf "\r\n"
            printf -- "--%s--\r\n" "$BOUNDARY"
          } > /tmp/deploy-body.bin

          echo "Uploading worker script..."
          HTTP_CODE=$(curl -s -o /tmp/deploy-response.json -w "%{http_code}" \
            -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: multipart/form-data; boundary=${BOUNDARY}" \
            --data-binary @/tmp/deploy-body.bin)

          echo "HTTP Status: ${HTTP_CODE}"
          cat /tmp/deploy-response.json | python3 -m json.tool 2>/dev/null || cat /tmp/deploy-response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Worker upload failed with status ${HTTP_CODE}"
            exit 1
          fi

          echo "Worker deployed successfully"
